# Render "Blueprint": New + > Blueprint > pick this repo. You will be asked for the secrets marked sync:false.
services:
  - type: web
    name: vendor-onboarding
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: EXTRACTION_CACHE
        value: "0"
      - key: RUNS_PER_HOUR
        value: "40"
